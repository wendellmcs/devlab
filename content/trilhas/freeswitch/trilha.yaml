id: freeswitch
titulo: "FreeSWITCH / PABX"
resumo: >-
  Do registro de um softphone ao dialplan, URA, voicemail e CDR — com
  softphone pjsua real dentro do lab.
ordem: 5
icone: "☎"
fase: 3
# Os três níveis estão escritos e exercitados. A capacidade declarada por nível
# abaixo é o rótulo honesto do que cada um entrega — o engenheiro não promete
# URA com menus aninhados nem conferência, que ficaram de fora (o construtor
# entrega URA de um nível).
situacao: disponivel
capacidades:
  operador: "Sei operar o fs_cli, registrar ramal e ler o trace de uma chamada."
  construtor: "Sei criar usuário no directory e escrever dialplan com contextos, condições, ações e mídia."
  engenheiro: "Sei entregar caixa postal, grupos de toque, troncos com DID e failover; sei medir capacidade e provar como uma fraude entrou."
