id: pbx-eng-05-carga
trilha: freeswitch
nivel: engenheiro
ordem: 5
titulo: "Quanto essa central aguenta — e o que quebra primeiro"
capacidade: "Sei gerar carga contra um PBX de verdade, achar o teto que ele impõe e provar que ele mudou de lugar."
xp: 70
prereqs: [pbx-eng-04-esl-cdr]

lab:
  imagem: devlab/freeswitch-lab:1.0.0
  usuario: root
  workdir: /root
  rede: nenhuma
  # O alvo da carga é uma extensão no `public`, alcançada pelo perfil externo —
  # que é o único que aceita chamada sem autenticar (`auth-calls=false` na
  # config vanilla). Isso evita que a lição vire uma aula de digest no gerador
  # de carga, e é fiel: uma operadora entrega chamada por tronco, sem
  # autenticar cada INVITE.
  #
  # O `silence_stream://30000` mantém a chamada de pé sem consumir disco nem
  # depender de arquivo de áudio, e é longo o bastante para que quem desliga
  # seja sempre o gerador — assim a duração de cada chamada é uma decisão do
  # teste, e não do dialplan.
  #
  # `sessions-per-second` fica no valor DE FÁBRICA (30). Ele é o teto que a
  # lição existe para encontrar.
  setup: |
    C=/usr/local/freeswitch/etc/freeswitch
    cat > "$C/dialplan/public/50_carga.xml" <<'XML'
    <include>
      <extension name="alvo-de-carga">
        <condition field="destination_number" expression="^9000$">
          <action application="answer"/>
          <action application="playback" data="silence_stream://30000"/>
          <action application="hangup"/>
        </condition>
      </extension>
    </include>
    XML
    devlab-pbx iniciar >/dev/null

ensina:
  conceitos:
    - id: carga-precisa-de-alvo-real
      titulo: "medir capacidade contra outro gerador mede o gerador: o alvo precisa ser o sistema que vai receber a carga em produção"
    - id: o-primeiro-teto-e-de-config
      titulo: "o primeiro limite que aparece quase nunca é a máquina — é um parâmetro de proteção, posto ali de propósito para o excesso não derrubar o que já está no ar"
    - id: recusa-rapida-nao-e-lentidao
      titulo: "sob excesso a central não fica lenta: ela **recusa** na hora, e só o excedente. Ler isso como lentidão manda o diagnóstico para o lado errado"
  comandos: [sipp]

ensino:
  gancho: |
    Chamado 9310, do comercial:

    > "Estamos fechando com um cliente de 300 ramais. Eles perguntaram quantas
    > chamadas por segundo a nossa central aguenta e **ninguém soube
    > responder**. Preciso de um número, e preciso saber o que acontece quando
    > ele é ultrapassado."

    Você não vai descobrir isso lendo documentação, e não vai descobrir
    esperando o cliente entrar. Vai descobrir **fazendo** — gerando chamada de
    verdade contra esta central até ela dizer chega.

    E ela vai dizer chega bem antes do que a máquina aguenta. O primeiro muro
    não é o processador: é uma linha de config que alguém escreveu de
    propósito, e entender por que ela existe é metade da resposta.

  objetivos:
    - verbo: executar
      texto: "gerar carga de chamadas reais contra a central e ler o resultado"
    - verbo: diagnosticar
      texto: "identificar o limite que a central impôs, pela resposta SIP e pela linha do log"
    - verbo: adaptar
      texto: "mover o teto de propósito e provar que ele mudou de lugar"
    - verbo: explicar
      texto: "explicar por que a central recusa em vez de ficar lenta, e por que isso é melhor"

  modelo_mental: |
    ### Por que este teste só cabia aqui

    Na trilha de troubleshooting você gerou chamada com SIPp contra outro
    SIPp. Aquilo prova protocolo — reproduz um defeito, exercita um cenário —
    e **não prova capacidade**: um gerador respondendo a outro gerador mede os
    dois geradores.

    Capacidade precisa de um alvo real, que faça o trabalho real: casar
    condição de dialplan, criar sessão, negociar mídia, gravar bilhete. Por
    isso este teste é o último da trilha, e não o primeiro.

    ### O gerador, em quatro opções

    ```
    sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin
    ```

    | opção | o que decide |
    |---|---|
    | `-sn uac` | o cenário embutido de quem liga: INVITE, ACK, pausa, BYE |
    | `-s 9000` | o número discado — aqui, a extensão que só atende e segura a chamada |
    | `-m 120` | quantas chamadas fazer **no total**, e quando parar |
    | `-r 40` | quantas iniciar **por segundo** — é este que aperta a central |
    | `-d 3000` | quanto tempo cada chamada fica de pé, em milissegundos |

    O relatório final traz duas linhas que respondem tudo: **Successful call**
    e **Failed call**. É a taxa em que a segunda deixa de ser zero que o
    comercial está pedindo.

    O alvo é a porta **5080**, do perfil externo — o único que aceita chamada
    sem autenticar. Não é atalho: é como uma operadora entrega chamada por um
    tronco.

    ### O teto, e por que ele existe

    O FreeSWITCH nasce com um limite de **sessões por segundo**, e ele é
    baixo de propósito:

    ```
    devlab-pbx cli "fsctl sps"
    +OK sessions per second: 30
    ```

    Passando disso, a central **não desacelera**. Ela responde ao excedente na
    hora:

    ```
    SIP/2.0 503 Maximum Calls In Progress
    ```

    e escreve no próprio log quem foi barrado:

    ```
    [CRIT] switch_time.c:1243 Over Session Rate of 30!
    [CRIT] switch_core_session.c:2422 Throttle Error! 47
    ```

    Isso é **descarte de excesso**, e é a coisa certa a fazer. A alternativa —
    aceitar tudo e ficar lenta — degradaria as chamadas que já estavam no ar,
    inclusive as que estão falando. Recusar a chamada 31 protege as trinta que
    já entraram.

    O sintoma que isso produz no cliente é: *"algumas ligações não completam
    no horário de pico, mas as que completam ficam perfeitas"*. Quem lê isso
    como "a central está lenta" vai investigar codec, rede e disco, e não vai
    achar nada.

    ### Dois lugares para mudar o mesmo número

    | onde | efeito | dura até |
    |---|---|---|
    | `fsctl sps <n>` | vale **agora**, sem derrubar chamada | o próximo restart |
    | `sessions-per-second` em `switch.conf.xml` | vale a partir do **próximo restart** | sempre |

    E o `reloadxml` **não** serve aqui: ele relê a árvore, e este parâmetro é
    lido pelo núcleo na subida. Mudar só o arquivo e conferir com `fsctl sps`
    mostra o valor velho — o que parece que a mudança não pegou.

    Quem muda em produção faz os dois: o arquivo, para sobreviver ao restart, e
    o comando, para valer agora.

    ### E o número não é a resposta inteira

    Subir o teto não faz a máquina mais rápida — só move onde a fila se forma.
    Depois de mover, o próximo muro é o hardware, e ele avisa de outro jeito:
    processador em 100%, chamada demorando a atender, áudio picotado. Um teste
    de carga honesto diz **qual dos dois muros** você encontrou.

  anatomia:
    - linha: "sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin"
      partes:
        - trecho: "sipp"
          papel: comando
          explica: "o gerador de chamadas; aqui ele é quem LIGA, contra um PBX de verdade"
        - trecho: "-sn uac"
          papel: opcao
          explica: "usa o cenário embutido de quem liga: INVITE, ACK, pausa e BYE"
        - trecho: "127.0.0.1:5080"
          papel: argumento
          explica: "o alvo: o perfil externo, que aceita chamada sem autenticar"
        - trecho: "-m 120 -r 40"
          papel: opcao
          explica: "120 chamadas no total, iniciando 40 por segundo — é o `-r` que aperta"
        - trecho: "-d 3000"
          papel: opcao
          explica: "cada chamada fica 3 segundos de pé antes do BYE"
        - trecho: "-nostdin"
          papel: opcao
          explica: "não tenta ler o teclado; sem isso ele abre a tela interativa e nunca termina sozinho"

  demonstracao:
    - comando: "devlab-pbx cli \"status\" | grep -E \"session\""
      saida: |-2
        0 session(s) since startup
        0 session(s) - peak 0, last 5min 0
        0 session(s) per Sec out of max 30, peak 0, last 5min 0
        1000 session(s) max
      nota: "Os números que a central declara sobre si mesma. A terceira linha é a que interessa: **sessões por segundo, de um máximo de 30**. A última é outro teto, dez vezes mais alto e de outra natureza — sessões simultâneas."
    - comando: "devlab-pbx cli \"fsctl sps\""
      saida: |-2
        +OK sessions per second: 30
      nota: "O mesmo teto, perguntado direto. Este comando também **escreve**: com um número na frente, ele muda o limite ao vivo, sem derrubar nada."
    - comando: "sipp -sn uac 127.0.0.1:5080 -s 9000 -m 20 -r 10 -d 2000 -nostdin -fd 20 2>&1 | sed \"s/\\x1b\\[[0-9;]*[a-zA-Z]//g\" | grep -E \"Successful call|Failed call\" | sed -E \"s/ +\\| +/ | /g;s/ *$//\""
      saida: |-2
          Successful call | 0 | 20
          Failed call | 0 | 0
      nota: "Uma carga leve, bem abaixo do teto: **20 chamadas, 20 completas, nenhuma falha**. É assim que se parece um teste que ainda não achou nada — e é por isso que começar baixo e subir é a única forma de saber onde o muro está."

  pratica_guiada: []

  compreensao:
    - tipo: diagnostico
      pergunta: "O cliente diz que no pico da manhã \"algumas ligações não completam, mas as que completam ficam perfeitas\". Que hipótese isso sugere, e qual ele NÃO sugere?"
      resposta: |
        Sugere **descarte por excesso**: a central está recusando o que passa
        de um limite, na hora, e quem entrou não é afetado.

        O que ele **não** sugere é lentidão ou problema de mídia. Se fosse
        processador saturado, rede ou codec, o dano apareceria nas chamadas que
        completaram — áudio picotado, atraso, atendimento demorado. A qualidade
        perfeita das que passaram é a informação mais valiosa da frase.

        O jeito de confirmar em dois minutos é olhar a resposta SIP das que
        falharam e o log da central no mesmo instante. `503` e uma linha
        dizendo o teto fecham o caso sem precisar de captura.
    - tipo: predicao
      pergunta: "Você muda `sessions-per-second` no arquivo, roda `reloadxml`, e pergunta o valor à central. O que ela responde?"
      resposta: |
        O valor **antigo**.

        Este parâmetro é lido pelo núcleo quando ele sobe, e o `reloadxml` relê
        a árvore de configuração sem reconstruir o núcleo. O arquivo já está
        certo; o processo em execução não sabe disso.

        É a terceira vez na trilha que a mesma armadilha aparece com uma cara
        nova: `reloadxml` aceita XML quebrado, não instancia gateway novo, e
        não relê o que o núcleo leu na subida. A defesa é sempre a mesma —
        **confirme perguntando à central**, e nunca relendo o arquivo.
    - tipo: transferencia
      pergunta: "Você sobe o teto e a carga passa. O comercial pergunta se pode prometer esse número ao cliente. O que você responde?"
      resposta: |
        Que esse número é o teto que a **configuração** impõe, e não o que a
        máquina aguenta — são coisas diferentes, e o teste até agora só
        encontrou a primeira.

        Para responder de verdade é preciso continuar subindo até o segundo
        muro, que avisa de outro jeito: processador em 100%, atendimento
        demorando, áudio degradando nas chamadas que completaram. E é preciso
        medir com chamadas parecidas com as do cliente — com mídia, com a
        duração média real, com o dialplan que ele vai usar.

        Um teste com chamadas de três segundos e silêncio digital mede o
        caminho de sinalização. É um número honesto sobre o que mediu, e
        prometer que ele vale para 300 ramais falando é outra afirmação.

objetivo_md: |
  A central está no ar, com a configuração de fábrica. A extensão **9000**, no
  contexto em que as chamadas de fora caem, atende e segura a chamada — é o
  alvo do teste.

  O gerador é o **`sipp`**, e ele deve mirar em **`127.0.0.1:5080`**, o perfil
  externo.

  ### Sua entrega

  1. **Ache o muro.** Suba a taxa até a central começar a recusar chamadas, e
     descubra, pela resposta SIP e pelo log dela, **qual limite** foi atingido.
  2. **Mova o muro** para **pelo menos 120** — nos dois lugares: o que vale
     agora e o que sobrevive ao próximo restart.
  3. **Prove.** Com o teto novo, **120 chamadas a 40 por segundo** têm de
     completar com **no máximo 5% de falhas**.

     > Cinco por cento, e não zero: a máquina que roda o teste também roda
     > tudo o mais. Um alvo de zero absoluto mede o ruído do host junto com o
     > PBX — e é o erro mais comum de quem escreve teste de carga.
  4. Grave em **`/root/capacidade.txt`** um laudo curto, contendo:
     - o valor de fábrica do limite;
     - a resposta SIP exata que o gerador recebeu quando ele foi ultrapassado;
     - o valor novo.

verificar:
  - descricao: "o teto de sessões por segundo subiu, e sobrevive a um restart"
    script: |
      #!/bin/bash
      CLI=/usr/local/freeswitch/bin/fs_cli
      CONF=/usr/local/freeswitch/etc/freeswitch/autoload_configs/switch.conf.xml
      if ! $CLI -x status >/dev/null 2>&1; then
        echo 'DEVLAB_JSON:{"mensagem":"o PBX nao esta de pe","dica_diagnostica":"suba com devlab-pbx iniciar"}'
        exit 1
      fi
      VIVO=$($CLI -x "fsctl sps" 2>/dev/null | grep -oE '[0-9]+$')
      if [ "${VIVO:-0}" -lt 120 ]; then
        echo "DEVLAB_JSON:{\"mensagem\":\"a central esta com o teto em ${VIVO:-?} sessoes por segundo\",\"dica_diagnostica\":\"o mesmo comando que pergunta o valor tambem o muda, quando recebe um numero. Mudar so o arquivo nao vale agora: este parametro e lido pelo nucleo na subida\"}"
        exit 1
      fi
      ARQ=$(grep -oE '<param name="sessions-per-second" value="[0-9]+"' "$CONF" | grep -oE '[0-9]+')
      if [ "${ARQ:-0}" -lt 120 ]; then
        echo "DEVLAB_JSON:{\"mensagem\":\"o arquivo ainda declara o teto em ${ARQ:-?}: a mudanca some no proximo restart\",\"dica_diagnostica\":\"o valor vivo e o do arquivo sao dois lugares diferentes; quem muda em producao muda os dois\"}"
        exit 1
      fi
      exit 0

  - descricao: "120 chamadas a 40 por segundo completam com no máximo 5% de falhas"
    script: |
      #!/bin/bash
      CLI=/usr/local/freeswitch/bin/fs_cli
      # Esperar a central esvaziar antes de medir: sobra de um teste anterior
      # ainda ocupando sessao mudaria o resultado deste, e o veredito passaria a
      # depender da ordem em que os checks rodaram.
      for _ in $(seq 1 40); do
        n=$($CLI -x "show channels count" 2>/dev/null | grep -oE '^[0-9]+')
        [ "${n:-0}" = 0 ] && break
        sleep 1
      done
      cd /tmp || exit 1
      SAIDA=$(timeout 120 sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin -fd 20 2>&1 \
              | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
      OK=$(printf '%s\n' "$SAIDA" | grep 'Successful call' | grep -oE '[0-9]+ *$' | tr -d ' ')
      FALHAS=$(printf '%s\n' "$SAIDA" | grep 'Failed call' | grep -oE '[0-9]+ *$' | tr -d ' ')
      if [ -z "$OK" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"o gerador de carga nao chegou a produzir relatorio","dica_diagnostica":"confira se a central responde e se a extensao 9000 atende: uma chamada sozinha pelo perfil externo tem de completar antes de valer a pena medir carga"}'
        exit 1
      fi
      # Teto de 5%, e nao zero: sob o teto de fabrica falham ~18% das chamadas,
      # e com o teto novo falham 0 numa maquina ociosa. A folga existe porque a
      # maquina que roda o teste tambem roda tudo o mais — um veredito de carga
      # com zero absoluto mede o ruido do host junto com o PBX.
      if [ "${FALHAS:-999}" -gt 6 ]; then
        echo "DEVLAB_JSON:{\"mensagem\":\"$FALHAS de 120 chamadas falharam a 40 por segundo\",\"dica_diagnostica\":\"veja a resposta SIP que elas receberam e a linha do log da central no mesmo instante: o numero que aparece na mensagem de erro E o teto que precisa subir\"}"
        exit 1
      fi
      exit 0

  - descricao: "/root/capacidade.txt traz o valor de fábrica, a resposta SIP e o valor novo"
    script: |
      #!/bin/bash
      ARQ=/root/capacidade.txt
      if [ ! -s "$ARQ" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"capacidade.txt nao existe ou esta vazio","dica_diagnostica":"o laudo tem tres informacoes: o teto de fabrica, a resposta SIP que o gerador recebeu quando ele foi ultrapassado, e o teto novo"}'
        exit 1
      fi
      if ! grep -q '30' "$ARQ"; then
        echo 'DEVLAB_JSON:{"mensagem":"o laudo nao menciona o valor de fabrica do teto","dica_diagnostica":"ele aparece no status da central e na linha que ela escreve no log quando barra uma chamada"}'
        exit 1
      fi
      if ! grep -q '503' "$ARQ"; then
        echo 'DEVLAB_JSON:{"mensagem":"o laudo nao traz a resposta SIP recebida pelo gerador","dica_diagnostica":"rode o sipp com -trace_err: ele grava num arquivo as mensagens que nao esperava, e a resposta esta la por extenso"}'
        exit 1
      fi
      if ! grep -qE '1[2-9][0-9]|[2-9][0-9]{2,}' "$ARQ"; then
        echo 'DEVLAB_JSON:{"mensagem":"o laudo nao traz o valor novo do teto","dica_diagnostica":"o chamado pede um numero para dar ao comercial: escreva o teto que a central passou a aceitar"}'
        exit 1
      fi
      exit 0

solucao_referencia: |
  # 1. Achar o muro: carga acima do teto de fábrica, guardando o que voltou.
  #    O sipp grava o rastro de erro no diretório corrente, que aqui é /root.
  find /root -maxdepth 1 -name '*_errors.log' -delete
  L=/usr/local/freeswitch/var/log/freeswitch/freeswitch.log
  : > "$L"
  timeout 120 sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin -fd 20 -trace_err >/dev/null 2>&1
  RESPOSTA=$(grep -ohE 'SIP/2\.0 [0-9]+ [A-Za-z ]+' /root/*_errors.log | sort -u)
  TETO=$(grep -oE 'Over Session Rate of [0-9]+!' "$L" | sort -u)

  # 2. Mover o muro nos dois lugares.
  sed -i 's|<param name="sessions-per-second" value="30"/>|<param name="sessions-per-second" value="120"/>|' \
    /usr/local/freeswitch/etc/freeswitch/autoload_configs/switch.conf.xml
  devlab-pbx cli "fsctl sps 120"

  # 3. O laudo.
  {
    printf 'teto de fabrica: 30 sessoes por segundo (%s)\n' "$TETO"
    printf 'resposta recebida pelo gerador acima do teto: %s\n' "$RESPOSTA"
    printf 'teto novo: 120 sessoes por segundo\n'
  } > /root/capacidade.txt

dicas:
  - "Comece com uma carga que você tem certeza de que passa e vá subindo o `-r`. Quando as falhas aparecerem, duas fontes respondem juntas o porquê: o que o gerador RECEBEU (`-trace_err` grava num arquivo o que ele não esperava) e o que a central ESCREVEU no log no mesmo instante."
  - "O número que aparece na mensagem do log é o próprio teto. Ele se pergunta e se muda com o mesmo comando do console — e o parâmetro correspondente no arquivo é lido pelo núcleo só na subida, então mexer no arquivo não muda nada agora."
  - "Carga: `sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin -trace_err`. Teto ao vivo: `devlab-pbx cli \"fsctl sps 120\"`. Permanente: `sessions-per-second` em `autoload_configs/switch.conf.xml`."

erros_comuns:
  - match: "503 Maximum Calls In Progress"
    digita: "sipp -sn uac 127.0.0.1:5080 -s 9000 -m 120 -r 40 -d 3000 -nostdin -trace_err"
    mensagem: "SIP/2.0 503 Maximum Calls In Progress"
    causa: "a central atingiu o teto de sessões por segundo e recusou o excedente na hora — é descarte de excesso, e não lentidão; as chamadas que entraram não foram afetadas"
    conserto: "confirme o teto atual perguntando à central e suba-o, se a capacidade da máquina permitir; a linha do log no mesmo instante diz qual número foi ultrapassado"
    categoria: conceitual
  - match: "Over Session Rate of"
    digita: "devlab-pbx erros"
    mensagem: "[CRIT] switch_time.c:1243 Over Session Rate of 30!"
    causa: "o núcleo barrou chamadas por exceder o limite de sessões por segundo; o `[CRIT]` aqui descreve uma proteção agindo, não um defeito da central"
    conserto: "trate como dado de capacidade: o número na mensagem é o teto vigente, e a decisão é subi-lo ou distribuir a carga"
    categoria: conceitual

cards_revisao:
  - carga-precisa-de-alvo-real
  - o-primeiro-teto-e-de-config
  - recusa-rapida-nao-e-lentidao
