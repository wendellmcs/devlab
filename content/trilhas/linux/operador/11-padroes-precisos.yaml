id: linux-op-11-padroes-precisos
trilha: linux
nivel: operador
ordem: 11
titulo: "Padrões precisos: ? e classes de caracteres"
capacidade: "Sei escrever um padrão que pega exatamente os arquivos que quero — nem um a mais."
xp: 22
prereqs: [linux-op-10-globbing]

lab:
  setup: |
    #!/bin/bash
    set -euo pipefail
    BASE=/home/aluno/configs
    # Nomes escolhidos para o `*` ser grosseiro demais: porta-10 tem dois
    # dígitos e porta-x não é número. Só `?` e as classes separam isso.
    for n in 1 2 3 10; do
      echo "porta=506$n" > "$BASE/porta-$n.conf"
    done
    echo 'porta=modelo' > "$BASE/porta-x.conf"
    chown aluno:aluno "$BASE"/porta-*.conf

ensina:
  conceitos:
    - id: interrogacao-casa-um-caractere
      titulo: "? casa exatamente um caractere — nem zero, nem dois"
    - id: colchetes-listam-caracteres-aceitos
      titulo: "[...] casa um caractere, escolhido de um conjunto que você define"
  comandos: []

ensino:
  gancho: |
    A pasta de configuração tem `porta-1.conf` até `porta-9.conf`, mais
    `porta-10.conf` e um `porta-x.conf` que é modelo, não configuração real.
    Você precisa dos de um dígito, sem levar o `porta-10` nem o modelo.

    `porta-*.conf` pega os doze. E aí você não copiou os arquivos que queria:
    copiou todos, e vai descobrir isso quando o serviço subir com a
    configuração errada.

  objetivos:
    - verbo: comparar
      texto: "escolher entre `*`, `?` e `[...]` conforme a precisão que o caso exige"
    - verbo: construir
      texto: "montar um padrão que pega exatamente os arquivos pretendidos"
    - verbo: prever
      texto: "prever o que um padrão vai casar antes de rodar o comando"

  modelo_mental: |
    Nome de arquivo em servidor **carrega informação**: número de porta, data,
    número do chamado, ramal. Um padrão grosseiro ignora essa informação; um
    padrão preciso a usa.

    Os três curingas respondem a perguntas diferentes:

    | Curinga | Casa | Serve para |
    |---|---|---|
    | `*` | qualquer sequência, inclusive vazia | "todos os .log" |
    | `?` | **exatamente um** caractere, qualquer um | "os de sufixo de um caractere só" |
    | `[0-9]` | **um** caractere, do conjunto listado | "os de sufixo numérico" |

    A diferença entre `?` e `*` é de **quantidade**: `porta-?.conf` não casa
    com `porta-10.conf`, porque `10` são dois caracteres e o `?` aceita um.

    A diferença entre `?` e `[0-9]` é de **conjunto**: `porta-?.conf` casa com
    `porta-x.conf` (o `x` é um caractere, e ao `?` tanto faz qual). Já
    `porta-[0-9].conf` recusa, porque `x` não está no conjunto.

    Quem expande continua sendo o shell, e a ferramenta de conferir continua
    sendo a mesma: `echo` na frente, antes de passar o padrão a um comando que
    copia ou apaga.

  anatomia:
    - linha: "cp ~/configs/porta-[0-9].conf ~/so-digitos/"
      partes:
        - trecho: "cp"
          papel: comando
          explica: "recebe a lista já expandida; nunca vê os colchetes"
        - trecho: "porta-"
          papel: argumento
          explica: "parte literal do nome: tem de casar caractere por caractere"
        - trecho: "[0-9]"
          papel: operador
          explica: "classe de caracteres, lida pelo shell: UM caractere, entre 0 e 9"
        - trecho: ".conf"
          papel: argumento
          explica: "sufixo literal; é ele que exclui arquivos com outra extensão"

  demonstracao:
    - comando: "ls configs"
      saida: |-2
        porta-1.conf
        porta-10.conf
        porta-2.conf
        porta-3.conf
        porta-x.conf
        ramais.txt
        rede.conf
      nota: "O terreno. Repare nos três tipos de sufixo: um dígito, dois dígitos e uma letra. É essa diferença que o padrão precisa enxergar."
    - comando: "echo configs/porta-*.conf"
      saida: |-2
        configs/porta-1.conf configs/porta-10.conf configs/porta-2.conf configs/porta-3.conf configs/porta-x.conf
      nota: "O `*` pega tudo, inclusive o porta-10 e o porta-x. Grosseiro demais para este caso."
    - comando: "echo configs/porta-?.conf"
      saida: |-2
        configs/porta-1.conf configs/porta-2.conf configs/porta-3.conf configs/porta-x.conf
      nota: "O `?` exige exatamente um caractere: o porta-10 ficou de fora. Mas o porta-x entrou, porque ao `?` tanto faz QUAL caractere é."
    - comando: "echo configs/porta-[0-9].conf"
      saida: |-2
        configs/porta-1.conf configs/porta-2.conf configs/porta-3.conf
      nota: "A classe exige um caractere E que ele seja dígito: sai o porta-10 (dois caracteres) e sai o porta-x (não é dígito). Exatamente os três pretendidos."
    - comando: "echo configs/porta-[13].conf"
      saida: |-2
        configs/porta-1.conf configs/porta-3.conf
      nota: "A classe não precisa ser um intervalo: dentro dos colchetes você lista os caracteres aceitos, um a um."

  pratica_guiada:
    - instrucao: "Veja no que expande o padrão mais amplo, sem copiar nada."
      modelo: "echo configs/porta-____.conf"
      resposta: "echo configs/porta-*.conf"
    - instrucao: "Agora restrinja a exatamente um caractere de sufixo, ainda só com echo."
      modelo: "echo configs/porta-____.conf"
      resposta: "echo configs/porta-?.conf"
    - instrucao: "Restrinja mais: um caractere E que seja dígito."
      modelo: "echo configs/porta-____.conf"
      resposta: "echo configs/porta-[0-9].conf"
    - instrucao: "Confirmado o padrão, crie a pasta de destino antes de copiar."
      modelo: "mkdir -p ____"
      resposta: "mkdir -p ~/so-digitos"

  compreensao:
    - tipo: predicao
      pergunta: "A pasta tem `ramal-7.conf`, `ramal-42.conf` e `ramal-a.conf`. O que `ramal-?.conf` casa?"
      resposta: |
        `ramal-7.conf` e `ramal-a.conf`. O `?` casa exatamente um caractere,
        qualquer um — então o `42` fica de fora por ter dois, e a letra `a`
        entra por ter um.
    - tipo: diagnostico
      pergunta: "Você roda `cp configs/porta-[0-9].conf destino/` e recebe `No such file or directory` falando de `porta-[0-9].conf`. O que isso diz?"
      resposta: |
        Que o padrão não casou com nenhum arquivo. O bash, não achando
        correspondência, entregou o texto literal ao `cp` — que foi procurar um
        arquivo com colchetes no nome. Confira com `echo` e com `ls configs`.
    - tipo: transferencia
      pergunta: "Você precisa dos logs de outubro a dezembro, nomeados `captura-2026-10.log` até `captura-2026-12.log`, sem pegar os de janeiro a setembro. Que padrão usa?"
      resposta: |
        `captura-2026-1[0-2].log`. A parte fixa vai até o `1`, e a classe
        resolve só o último dígito — aceitando 0, 1 e 2 e recusando o resto.

objetivo_md: |
  O `*` resolve o caso fácil. Quando o nome do arquivo carrega informação —
  e num servidor ele quase sempre carrega — é preciso ser mais exato.

  | Padrão | Casa com | Não casa com |
  |---|---|---|
  | `*` | qualquer sequência, inclusive vazia | — |
  | `?` | **exatamente um** caractere, qualquer um | dois ou zero |
  | `[123]` | **um** caractere entre os listados | qualquer outro |
  | `[0-9]` | **um** dígito | letra, ou dois dígitos |
  | `[!0-9]` | um caractere que **não** é dígito | dígito |

  O setup deixou cinco arquivos em `configs/`:

  ```
  porta-1.conf   porta-2.conf   porta-3.conf   porta-10.conf   porta-x.conf
  ```

  Repare na armadilha: `porta-*.conf` pega os cinco. `porta-?.conf` pega
  quatro — o `porta-10.conf` fica de fora porque `10` são **dois** caracteres,
  mas o `porta-x.conf` entra, porque `?` não sabe o que é dígito.

  ### Sua tarefa

  Sem listar arquivo por arquivo — use padrões:

  1. Copie para `~/um-caractere/` todos os `porta-…conf` cujo sufixo tem
     **exatamente um caractere**, seja ele qual for. São quatro.
  2. Copie para `~/so-digitos/` apenas os de sufixo **numérico de um dígito**.
     São três — o `porta-x.conf` tem de ficar de fora.

  > Dica de método que vale para a vida toda: teste o padrão com `echo` antes
  > de usá-lo num comando que altera coisas. `echo configs/porta-?.conf`
  > mostra exatamente no que ele expande, sem tocar em nada.

verificar:
  - descricao: "um-caractere/ tem os quatro de sufixo unitário, e não o porta-10"
    script: |
      #!/bin/bash
      DIR=/home/aluno/um-caractere
      if [ ! -d "$DIR" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"a pasta um-caractere/ nao existe","dica_diagnostica":"cp nao cria o diretorio de destino: crie antes com mkdir"}'
        exit 1
      fi
      for nome in porta-1.conf porta-2.conf porta-3.conf porta-x.conf; do
        if [ ! -f "$DIR/$nome" ]; then
          echo "faltando: $nome"
          echo 'DEVLAB_JSON:{"mensagem":"faltou algum arquivo de sufixo unitario","dica_diagnostica":"teste antes: echo ~/configs/porta-?.conf — o ? casa com QUALQUER caractere, inclusive letra"}'
          exit 1
        fi
      done
      if [ -e "$DIR/porta-10.conf" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"o porta-10.conf entrou, e nao deveria: o sufixo dele tem dois caracteres","dica_diagnostica":"um ? casa exatamente um caractere. Voce provavelmente usou * no lugar."}'
        exit 1
      fi
      exit 0

  - descricao: "so-digitos/ tem os três numéricos, sem o porta-x"
    script: |
      #!/bin/bash
      DIR=/home/aluno/so-digitos
      if [ ! -d "$DIR" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"a pasta so-digitos/ nao existe","dica_diagnostica":"crie o destino antes de copiar"}'
        exit 1
      fi
      for nome in porta-1.conf porta-2.conf porta-3.conf; do
        if [ ! -f "$DIR/$nome" ]; then
          echo "faltando: $nome"
          echo 'DEVLAB_JSON:{"mensagem":"faltou algum dos arquivos de sufixo numerico","dica_diagnostica":"uma classe de caracteres entre colchetes lista o que pode entrar — ou uma faixa, com hifen"}'
          exit 1
        fi
      done
      SOBRA=""
      for nome in porta-x.conf porta-10.conf; do
        [ -e "$DIR/$nome" ] && SOBRA="$SOBRA $nome"
      done
      if [ -n "$SOBRA" ]; then
        echo "nao deveria estar aqui:$SOBRA"
        echo 'DEVLAB_JSON:{"mensagem":"entrou arquivo que nao tem sufixo de um digito","dica_diagnostica":"o ? aceita letra tambem; para restringir a digito use uma classe como [0-9]"}'
        exit 1
      fi
      exit 0

  - descricao: "os originais continuam em configs/"
    script: |
      #!/bin/bash
      for nome in porta-1.conf porta-2.conf porta-3.conf porta-10.conf porta-x.conf; do
        if [ ! -f "/home/aluno/configs/$nome" ]; then
          echo "sumiu de configs/: $nome"
          echo 'DEVLAB_JSON:{"mensagem":"algum original saiu de configs/ — a tarefa era copiar, nao mover","dica_diagnostica":"cp deixa o original no lugar; mv nao. Use Resetar lab e refaca com cp."}'
          exit 1
        fi
      done
      exit 0

dicas:
  - "Os dois padrões que faltam estão na tabela do enunciado. Antes de copiar, use `echo` com cada um deles e compare a lista que sai: é a forma mais rápida de ver a diferença entre *um caractere qualquer* e *um dígito*."
  - "A forma é: `mkdir -p ~/um-caractere ~/so-digitos`, depois `cp ~/configs/porta-_.conf ~/um-caractere/` e `cp ~/configs/porta-[_-_].conf ~/so-digitos/`."
  - "mkdir -p ~/um-caractere ~/so-digitos && cp ~/configs/porta-?.conf ~/um-caractere/ && cp ~/configs/porta-[0-9].conf ~/so-digitos/"

erros_comuns:
  - match: "No such file or directory"
    digita: "cp configs/porta-[5-9].conf ~/destino/"
    mensagem: "cp: cannot stat 'configs/porta-[5-9].conf': No such file or directory"
    causa: "nenhum arquivo casou com o padrão, então o bash entregou o texto literal e o cp foi procurar um arquivo com colchetes no nome"
    conserto: "rode `echo configs/porta-[5-9].conf` primeiro e veja se ele expande em alguma coisa"
    categoria: conceitual
  - match: "omitting directory"
    digita: "cp configs/porta-* ~/destino/"
    mensagem: "cp: -r not specified; omitting directory 'configs/porta-antigas'"
    causa: "o `*` casou também com um diretório, e o cp sem -r recusa diretório"
    conserto: "aperte o padrão para casar só o que interessa, em vez de acrescentar -r"
    categoria: flag_errada

cards_revisao:
  - interrogacao-casa-um-caractere
  - colchetes-listam-caracteres-aceitos
  - echo-testa-o-padrao-antes
