id: linux-op-05-criar
trilha: linux
nivel: operador
ordem: 5
titulo: "Criar diretórios e arquivos"
capacidade: "Sei montar uma estrutura de pastas e arquivos do zero, num comando ou em vários."
xp: 16
prereqs: [linux-op-04-hierarquia]

objetivo_md: |
  - `mkdir pasta` cria um diretório. Com `-p`, cria também os pais que faltarem.
  - `touch arquivo` cria um arquivo vazio (ou só atualiza a data, se já existir).

  A chave de chaves do bash — `{a,b}` — expande em várias palavras:
  `mkdir -p base/{um,dois}` cria `base/um` e `base/dois` de uma vez.

  ### Sua tarefa

  Monte, na sua pasta pessoal, exatamente esta estrutura:

  ```
  chamados/
  └── 2026/
      ├── aberto/
      │   └── CH-1042.txt
      └── fechado/
  ```

  O arquivo `CH-1042.txt` pode ficar vazio.

  Depois, confira o resultado com `tree` — que desenha a árvore em vez de
  listar pasta por pasta — e **grave essa saída** em `estrutura.txt`, na sua
  pasta pessoal.

verificar:
  - descricao: "chamados/2026/aberto e chamados/2026/fechado existem"
    script: |
      #!/bin/bash
      FALTOU=""
      for d in /home/aluno/chamados/2026/aberto /home/aluno/chamados/2026/fechado; do
        [ -d "$d" ] || FALTOU="$FALTOU $d"
      done
      if [ -n "$FALTOU" ]; then
        echo "faltando:$FALTOU"
        echo 'DEVLAB_JSON:{"mensagem":"a estrutura de diretorios esta incompleta","dica_diagnostica":"confira o que existe hoje com: find ~/chamados -type d"}'
        exit 1
      fi
      exit 0

  - descricao: "CH-1042.txt está dentro de chamados/2026/aberto"
    script: |
      #!/bin/bash
      ARQ=/home/aluno/chamados/2026/aberto/CH-1042.txt
      if [ -d "$ARQ" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"CH-1042.txt foi criado como diretorio, nao como arquivo","dica_diagnostica":"mkdir cria diretorio; para arquivo vazio use touch. Remova o diretorio com rmdir e refaca."}'
        exit 1
      fi
      if [ ! -f "$ARQ" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"CH-1042.txt nao esta em chamados/2026/aberto","dica_diagnostica":"procure onde ele foi parar com: find ~ -name CH-1042.txt"}'
        exit 1
      fi
      exit 0

  - descricao: "estrutura.txt tem a árvore desenhada pelo tree"
    script: |
      #!/bin/bash
      ARQ=/home/aluno/estrutura.txt
      if [ ! -f "$ARQ" ]; then
        echo 'DEVLAB_JSON:{"mensagem":"estrutura.txt nao existe na sua pasta pessoal","dica_diagnostica":"o comando que desenha a arvore de diretorios e o tree; redirecione a saida com >"}'
        exit 1
      fi
      # Os ramos desenhados só existem na saída do tree; o ls não os produz.
      if ! grep -q '──' "$ARQ"; then
        echo 'DEVLAB_JSON:{"mensagem":"o arquivo nao parece a saida do tree (faltam os ramos da arvore)","dica_diagnostica":"compare ls -R com tree: so o tree desenha os ramos"}'
        exit 1
      fi
      for esperado in aberto fechado CH-1042.txt; do
        if ! grep -q "$esperado" "$ARQ"; then
          echo "faltando na arvore: $esperado"
          echo 'DEVLAB_JSON:{"mensagem":"a arvore gravada nao mostra toda a estrutura","dica_diagnostica":"aponte o tree para ~/chamados, nao para uma subpasta"}'
          exit 1
        fi
      done
      exit 0

dicas:
  - "Você precisa de dois comandos diferentes: um cria diretórios, outro cria o arquivo vazio. E lembre que criar três níveis de pasta de uma vez tem uma opção própria. Para conferir, existe um comando que desenha a árvore."
  - "A forma é: `mkdir -p ~/chamados/2026/{______,______}`, depois `touch ~/chamados/2026/aberto/CH-1042.txt`, e por fim `____ ~/chamados > ~/estrutura.txt`."
  - "mkdir -p ~/chamados/2026/{aberto,fechado} && touch ~/chamados/2026/aberto/CH-1042.txt && tree ~/chamados > ~/estrutura.txt"

erros_comuns:
  - match: "cannot create directory.*No such file or directory"
    explica: "Sem `-p`, o `mkdir` não cria os diretórios intermediários."
    categoria: flag_errada
  - match: "Is a directory"
    explica: "Você tentou tratar um diretório como se fosse arquivo. `mkdir` cria pasta; `touch` cria arquivo."
    categoria: conceitual


cards_revisao:
  - tree-desenha-a-arvore
  - mkdir-p-cria-os-pais
  - touch-cria-arquivo-vazio
  - chaves-expandem-em-varias-palavras
