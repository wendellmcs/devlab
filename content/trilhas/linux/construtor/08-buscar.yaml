solucao_referencia: |
  cd /home/aluno
  find arquivo -name '*.log' | sort > relatorios/achados.txt
  find arquivo -name '*.log' -size +10k | sort > relatorios/grandes.txt
  find arquivo -name '*.log' | xargs wc -c | tail -1 | awk '{print $1}' > relatorios/total-bytes.txt
