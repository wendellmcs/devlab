id: voip-troubleshooting
titulo: "Troubleshooting SIP/RTP"
resumo: >-
  A trilha de maior retorno imediato: sngrep, tshark e SIPp para
  transformar 'não funciona' em causa provada por evidência.
ordem: 6
icone: "◉"
fase: 3
situacao: disponivel
capacidades:
  operador: "Sei ler um diálogo SIP no sngrep e identificar o código de resposta."
  construtor: "Sei capturar no ponto certo e provar se o problema é sinalização ou mídia."
  # A redação anterior prometia NAT, e o lab não tem NAT: com `rede: nenhuma`
  # o diálogo inteiro acontece em 127.0.0.0/8, onde não há tradução de
  # endereço para observar. Prometer o que não se entrega é pior do que
  # entregar menos — o rótulo é onde a honestidade mora (ver a decisão 37).
  engenheiro: "Sei escrever o cenário que reproduz o defeito e diagnosticar registro, retransmissão e loop de roteamento."
