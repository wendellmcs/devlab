name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio explícito. Nenhum job aqui escreve no repositório, publica
# pacote ou comenta em PR — então o GITHUB_TOKEN não precisa poder fazer nada
# além de ler o código. Declarar no topo também impede que um job novo herde
# permissão de escrita sem que alguém repare.
permissions:
  contents: read

jobs:
  qualidade:
    name: tipos, testes e conteúdo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `npm run valida` depende de PyYAML; o runner não o traz por padrão.
      - name: Dependência do validador de conteúdo
        run: python3 -m pip install --quiet pyyaml

      - name: Checagem de tipos
        run: npm run tipos

      - name: Testes unitários
        run: npm run teste

      - name: Validação do conteúdo declarativo
        run: npm run valida

      - name: Build da interface
        run: npm run build --workspace @devlab/ui

  labs:
    name: labs reais (imagem + integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Evita deriva de upstream: os checks rodam contra a imagem real antes
      # de qualquer mudança ser promovida.
      - name: Construir devlab/linux-base
        run: npm run imagens

      - name: Testes de integração (containers de verdade)
        run: npm run teste:integracao

      # Prova o sistema cabeado: HTTP, XP, portão das dicas, IA desligada.
      - name: Prova de fumaça (loop central pela API)
        run: npm run fumaca

  acessibilidade:
    name: axe-core AAA e percurso de teclado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Só o Chromium. O gate é WCAG, não compatibilidade entre navegadores —
      # baixar Firefox e WebKit custaria minutos por execução sem medir nada
      # que o critério exija.
      - name: Navegador da auditoria
        run: npx playwright install --with-deps chromium

      # A auditoria roda sobre o bundle servido, não sobre o dev server: é o
      # artefato que o aluno recebe que precisa passar.
      - name: Build da interface
        run: npm run build

      # axe-core com color-contrast-enhanced (1.4.6, 7:1) explicitamente
      # ligada — ela vem desligada — sobre 7 telas nos 2 temas. O próprio
      # script se auto-testa antes com uma amostra a 5,33:1: se a regra não
      # estiver rodando, ele morre em vez de imprimir um zero que mente.
      - name: axe-core nas telas reais, nos dois temas
        run: npm run a11y:axe

      # Percurso central inteiro sem mouse: alcançar, ativar, entrar e sair do
      # terminal, e não perder o foco no caminho.
      - name: Percurso só com teclado
        run: npm run a11y:teclado

  instalador:
    name: sintaxe dos scripts de instalação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for s in install.sh scripts/*.sh; do
            bash -n "$s" || exit 1
            echo "ok  $s"
          done
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh scripts/*.sh
